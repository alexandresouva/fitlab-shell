<fitlab-sidebar [attr.open]="isOpen() ? true : null">
  <nav class="sidebar-nav" aria-label="Navegação Principal">
    <ul class="nav-list">
      @for (item of navItems; track item.route) {
        <li class="nav-item">
          <fitlab-nav-item
            #rla="routerLinkActive"
            [routerLinkActive]="'active'"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            [attr.active]="rla.isActive ? true : null"
          >
            <a [routerLink]="item.route" (click)="onNavClick()">
              <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          </fitlab-nav-item>
        </li>
      }
    </ul>
  </nav>

  <div slot="footer" class="sidebar-footer">
    <span class="version-badge">FitLab v1.0 &bull; Shell</span>
  </div>
</fitlab-sidebar>
