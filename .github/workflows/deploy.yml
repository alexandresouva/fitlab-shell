name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shell Code
        uses: actions/checkout@v4
        with:
          path: fitlab-shell

      - name: Checkout Tooling Code
        uses: actions/checkout@v4
        with:
          repository: alexandresouva/fitlab-lib-tooling
          path: fitlab-lib-tooling

      - name: Checkout Design System Code
        uses: actions/checkout@v4
        with:
          repository: alexandresouva/fitlab-lib-design-system
          path: fitlab-lib-design-system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: fitlab-shell/package-lock.json

      - name: Install and Build Tooling
        run: |
          cd fitlab-lib-tooling
          npm ci
          npm run build

      - name: Install and Build Design System
        run: |
          cd fitlab-lib-design-system
          npm ci
          npm run build

      - name: Install Shell Dependencies
        run: |
          cd fitlab-shell
          npm ci

      - name: Lint Code
        run: |
          cd fitlab-shell
          npm run lint

      - name: Run Tests
        run: |
          cd fitlab-shell
          npm run test:ci

      - name: Build Application
        run: |
          cd fitlab-shell
          npm run build

  deploy:
    name: Deploy Assets
    runs-on: ubuntu-latest
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout Shell Code
        uses: actions/checkout@v4
        with:
          path: fitlab-shell

      - name: Checkout Tooling Code
        uses: actions/checkout@v4
        with:
          repository: alexandresouva/fitlab-lib-tooling
          path: fitlab-lib-tooling

      - name: Checkout Design System Code
        uses: actions/checkout@v4
        with:
          repository: alexandresouva/fitlab-lib-design-system
          path: fitlab-lib-design-system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: fitlab-shell/package-lock.json

      - name: Install and Build Tooling
        run: |
          cd fitlab-lib-tooling
          npm ci
          npm run build

      - name: Install and Build Design System
        run: |
          cd fitlab-lib-design-system
          npm ci
          npm run build

      - name: Install Shell Dependencies
        run: |
          cd fitlab-shell
          npm ci

      - name: Build Application
        run: |
          cd fitlab-shell
          npm run build

      - name: Update manifest for production
        run: |
          echo '{"mfe-workout-planner": "/workouts/remoteEntry.json"}' > fitlab-shell/dist/fitlab-shell/browser/federation.manifest.json

      - name: Sync to S3
        run: aws s3 sync fitlab-shell/dist/fitlab-shell/browser/ s3://fitlab-mfe-shell-dev/ --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"
